name: WakiTaki
options:
  bundleIdPrefix: com.kkandda84
  deploymentTarget:
    iOS: "16.0"
targets:
  WakiTaki:
    type: application
    platform: iOS
    sources: [WakiTaki]
    info:
      path: WakiTaki/Info.plist
      properties:
        CFBundleDisplayName: 와키타키
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: 말할 때 음성을 상대방에게 전송하기 위해 마이크가 필요합니다.
        NSLocalNetworkUsageDescription: 주변의 상대방 기기를 찾아 연결하기 위해 필요합니다.
        NSBonjourServices: [_wakitaki._tcp, _wakitaki._udp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kkandda84.wakitaki
        SWIFT_VERSION: "5.0"
